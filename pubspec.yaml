name: tminus1
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.11.3

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_svg: ^2.0.16
  animated_toggle_switch: ^0.8.7
  dio: ^5.9.2
  pretty_dio_logger: ^1.4.0
  lottie: ^3.3.2
  easy_localization: ^3.0.8
  get_it: ^9.2.1
  dartz: ^0.10.1
  json_annotation: ^4.11.0
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  cached_network_image: ^3.4.1
  fl_chart: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.5
  json_serializable: ^6.13.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/svg/

  fonts:
    - family: NeueMontreal
      fonts:
        - asset: assets/fonts/NeueMontreal-Bold.otf
          weight: 700
        - asset: assets/fonts/NeueMontreal-BoldItalic.otf
          weight: 700
          style: italic
        - asset: assets/fonts/NeueMontreal-Medium.otf
          weight: 500
        - asset: assets/fonts/NeueMontreal-MediumItalic.otf
          weight: 500
          style: italic
        - asset: assets/fonts/NeueMontreal-Regular.otf
          weight: 400
        - asset: assets/fonts/NeueMontreal-Italic.otf
          weight: 400
          style: italic
        - asset: assets/fonts/NeueMontreal-Light.otf
          weight: 300
        - asset: assets/fonts/NeueMontreal-LightItalic.otf
          weight: 300
          style: italic